name: Feature request
description: Propose a new API or a change to an existing one.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        NoThrow keeps a deliberately small, dependency-free API. Please agree on the design here before opening a pull request.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and why is it hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: How would the code look with your proposal?
      render: csharp
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
      description: What do you do today instead? What other designs did you consider?
  - type: dropdown
    id: breaking
    attributes:
      label: Is this a breaking change?
      options:
        - "No"
        - "Yes"
        - Not sure
    validations:
      required: true
